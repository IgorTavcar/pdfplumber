name: Tests

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Check formatting and linting with ruff
      run: |
        uv run ruff format --check pdfplumber tests
        uv run ruff check pdfplumber tests

    - name: Check type annotations via mypy
      run: uv run mypy pdfplumber

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install ghostscript
      run: sudo apt update && sudo apt install ghostscript

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run tests
      run: |
        uv run pytest -n auto
        uv run coverage html

    - name: Upload code coverage
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'

    - name: Build package
      run: uv build
